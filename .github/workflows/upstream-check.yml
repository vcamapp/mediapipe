name: Upstream check
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./scripts/upstream-check.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.check.outputs.exit_code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh issue list --state open --search 'in:title MediaPipeTasksVision upstream update available' --json number --jq 'length')" -eq 0 ]; then
            gh issue create --title "MediaPipeTasksVision upstream update available" --body "A newer google-ai-edge/mediapipe GitHub release than the bundled version is available. Run scripts/upstream-check.sh and update MEDIAPIPE_VERSION (and MACOS_MEDIAPIPE_VERSION once the macOS patches are rebased) after reviewing headers, symbols, and both architectures."
          fi
      - if: steps.check.outputs.exit_code != '0' && steps.check.outputs.exit_code != '10'
        run: exit 1
